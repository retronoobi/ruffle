[package]
name = "ruffle_libretro"
version = "0.3.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Experimental offline OpenGL libretro core for Flash SWF games"
repository = "https://github.com/retronoobi/ruffle"
readme = "README.md"
rust-version = "1.98"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ruffle_core = { path = "../core", features = ["audio", "mp3", "aac", "nellymoser", "lzma", "default_compatibility_rules", "default_font"] }
ruffle_render = { path = "../render", features = ["tessellator"] }
ruffle_video_software = { path = "../video/software" }
swf = { path = "../swf" }
glow = "0.16"
bytemuck = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { workspace = true, features = ["derive"] }
flate2 = "1"
chrono = { workspace = true, features = ["clock"] }
sha2 = "0.11"
url = "2"
async-channel = "2.5"
naga = { workspace = true, features = ["glsl-out", "wgsl-in"] }
naga-pixelbender = { path = "../render/naga-pixelbender" }
naga-agal = { path = "../render/naga-agal" }

[dev-dependencies]
png = "0.18"
